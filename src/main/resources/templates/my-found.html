<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My found items')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 fw-bold mb-0">Items I found</h1>
        <a class="btn btn-primary" th:href="@{/found/new}">Report another</a>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(items)}">You have not reported any found item yet.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(items)}">
        <table class="table bg-white align-middle">
            <thead><tr><th></th><th>Item</th><th>Category</th><th>Found at</th><th>Date</th><th>Kept at</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td><img th:if="${i.photoId != null}" th:src="@{/photos/{id}(id=${i.photoId})}" class="item-photo" style="width:56px;height:56px" alt=""></td>
                <td th:text="${i.title}">title</td>
                <td th:text="${i.category}">cat</td>
                <td th:text="${i.location}">loc</td>
                <td th:text="${i.itemDate}">date</td>
                <td th:text="${i.holdingPlace}">place</td>
                <td>
                    <span class="badge text-bg-secondary" th:if="${i.status.name() == 'OPEN'}">Waiting for owner</span>
                    <span class="badge text-bg-info" th:if="${i.status.name() == 'RESERVED'}">Owner verified - pickup pending</span>
                    <span class="badge text-bg-success" th:if="${i.status.name() == 'RETURNED'}">Returned to owner</span>
                    <span class="badge text-bg-light border" th:if="${i.status.name() == 'WITHDRAWN'}">Withdrawn</span>
                </td>
                <td>
                    <form th:if="${i.status.name() == 'OPEN'}" th:action="@{/found/{id}/withdraw(id=${i.id})}" method="post"
                          onsubmit="return confirm('Withdraw this found report?');">
                        <button class="btn btn-sm btn-outline-secondary">Withdraw</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
