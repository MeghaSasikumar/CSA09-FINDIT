<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Report item')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width: 760px">
    <h1 class="h3 fw-bold" th:text="${kind == 'lost'} ? 'Report a lost item' : 'Report a found item'">Report</h1>

    <div th:replace="~{fragments :: flash}"></div>

    <form th:action="@{/{k}(k=${kind},_csrf=${_csrf.token})}" th:object="${form}" method="post" enctype="multipart/form-data" class="card card-body mt-3">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="category">Category</label>
                <select class="form-select" th:field="*{category}">
                    <option value="">Choose...</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="title">Short title</label>
                <input class="form-control" th:field="*{title}" placeholder="e.g. Black phone with blue cover">
                <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="location" th:text="${kind == 'lost'} ? 'Where did you lose it?' : 'Where did you find it?'">Location</label>
                <select class="form-select" th:field="*{location}">
                    <option value="">Choose...</option>
                    <option th:each="l : ${locations}" th:value="${l}" th:text="${l}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="itemDate" th:text="${kind == 'lost'} ? 'Date lost' : 'Date found'">Date</label>
                <input type="date" class="form-control" th:field="*{itemDate}">
                <div class="text-danger small" th:if="${#fields.hasErrors('itemDate')}" th:errors="*{itemDate}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="description">General description (public details only)</label>
                <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
            </div>
        </div>

        <div class="mt-3">
            <label class="form-label" for="photo">Photo of the item (optional)</label>
            <input type="file" class="form-control" id="photo" name="photo" accept="image/jpeg,image/png,image/webp">
            <div class="form-text" th:text="${kind == 'lost'}
                ? 'JPG, PNG or WEBP, up to 2 MB. Only you and the admin can see it. It helps the admin check the item.'
                : 'JPG, PNG or WEBP, up to 2 MB. Only the admin can see it. The owner sees it only after the admin approves the claim.'">help</div>
        </div>

        <div class="private-box mt-4">
            <h2 class="h6 fw-bold mb-1" th:text="${kind == 'lost'} ? 'Private questions - only the real owner can answer' : 'Hidden details - never shown to anyone'">Private</h2>
            <p class="small text-muted mb-3" th:text="${kind == 'lost'}
                ? 'Answer from memory. The system compares your answers with details the finder recorded. Fake claimers will not see any match.'
                : 'Look at the item and note what only the owner would know. Do not tell anyone. The system uses it to verify the owner.'">help</p>
            <div class="mb-3">
                <label class="form-label" id="q1" for="private1">Question 1</label>
                <input class="form-control" th:field="*{private1}">
            </div>
            <div class="mb-3">
                <label class="form-label" id="q2" for="private2">Question 2</label>
                <input class="form-control" th:field="*{private2}">
            </div>
            <div class="mb-0">
                <label class="form-label" id="q3" for="private3">Question 3</label>
                <input class="form-control" th:field="*{private3}">
            </div>
        </div>

        <div class="mt-3" th:if="${kind == 'found'}">
            <label class="form-label" for="holdingPlace">Where is the item being kept?</label>
            <input class="form-control" th:field="*{holdingPlace}" placeholder="e.g. Security office, Main Gate">
            <div class="text-danger small" th:if="${#fields.hasErrors('holdingPlace')}" th:errors="*{holdingPlace}"></div>
            <div class="form-text">Shown to the owner only after the admin approves the claim.</div>
        </div>

        <button class="btn btn-primary mt-4 align-self-start" th:text="${kind == 'lost'} ? 'Save and find matches' : 'Save found item'">Save</button>
    </form>
</div>

<script th:inline="javascript">
    const questionMap = /*[[${questionMap}]]*/ {};
    const select = document.getElementById('category');
    function updateQuestions() {
        const qs = questionMap[select.value] || ['Question 1 (choose a category first)', 'Question 2', 'Question 3'];
        for (let i = 0; i < 3; i++) {
            document.getElementById('q' + (i + 1)).textContent = qs[i];
        }
    }
    select.addEventListener('change', updateQuestions);
    updateQuestions();
</script>
</body>
</html>
