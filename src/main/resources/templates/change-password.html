<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body>
<div class="login-wrap px-3">
    <h1 class="h4 fw-bold mb-3">Set your own password</h1>
    <div class="card"><div class="card-body p-4">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/change-password}" method="post">
            <div class="mb-3" th:if="${askCurrent}">
                <label class="form-label" for="currentPassword">Current password</label>
                <input class="form-control" id="currentPassword" name="currentPassword" type="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <input class="form-control" id="newPassword" name="newPassword" type="password" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm">Confirm new password</label>
                <input class="form-control" id="confirm" name="confirm" type="password" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100">Save password</button>
        </form>
    </div></div>
</div>
</body>
</html>
