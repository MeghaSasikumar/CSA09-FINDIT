spring.application.name=findit
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database: defaults to a local H2 file; on the cloud set DB_URL / DB_USER / DB_PASSWORD (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/findit}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# App settings
findit.admin-password=${ADMIN_PASSWORD:admin123}
findit.seed-demo=${SEED_DEMO:}

# Only emails ending with @<this domain> can be added or log in
findit.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:saveetha.com}

# Lost items with no match after this many days get a 'not found yet' message
findit.followup-days=${FOLLOWUP_DAYS:30}
findit.followup-cron=0 0 9 * * *

# Error details are hidden by default. To debug locally run:  $env:ERROR_DETAIL="always"  before starting.
server.error.include-message=${ERROR_DETAIL:never}
server.error.include-exception=false
